<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel='stylesheet' href='login.css'>
</head>
<body>
    <div class="login-wrapper">
        <form action="../userSVL" method="post" class="login-form">
            <h2>WELCOME</h2>

            <div class="form-group">
                <label for="password">Enter Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="FullName" required>
            </div>

            <div class="form-group">
                <label for="username">Enter User Name:</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label for="password">Enter Password:</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="form-group">
                <label for="password">Enter Email:</label>
                <input type="text" id="email" name="password" placeholder="Email" required>
            </div>

            <p><a href="    ?service=   ">Already have an account?</a></p>

            <button type="submit" class="btn-submit">Login</button>
        </form>
    </div>
</body>
</html>
